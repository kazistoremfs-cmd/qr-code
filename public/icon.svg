<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding for maskable icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer subtle circular ring -->
  <circle cx="256" cy="256" r="180" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4" fill="none" />

  <!-- Phone Outline -->
  <rect x="166" y="96" width="180" height="320" rx="36" fill="#0f172a" stroke="#ffffff" stroke-width="12" filter="url(#glow)" />
  
  <!-- Speaker notch -->
  <rect x="226" y="118" width="60" height="8" rx="4" fill="#64748b" />

  <!-- Screen Content Area -->
  <rect x="182" y="142" width="148" height="226" rx="18" fill="#1e293b" />

  <!-- Recharge lightning bolt / Signal wave -->
  <path d="M266 168 L220 252 L256 252 L246 322 L292 238 L256 238 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Taka Symbol Badge ৳ -->
  <circle cx="340" cy="350" r="48" fill="#10b981" stroke="#ffffff" stroke-width="8" filter="url(#glow)" />
  <text x="340" y="367" font-family="'Hind Siliguri', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">৳</text>

  <!-- Verified small star/dot in corner -->
  <circle cx="172" cy="162" r="12" fill="#38bdf8" />
</svg>
